name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Krita 6 source zip
        run: |
          set -eu
          version=""
          case "$GITHUB_REF" in
            refs/tags/*) version="${GITHUB_REF_NAME#v}" ;;
          esac
          if [ -n "$version" ]; then
            python tools/build_release_zip.py --version "$version"
          else
            python tools/build_release_zip.py
          fi

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MomoColorPicker-*-krita6-source.zip
          body_path: RELEASE_NOTES.md
